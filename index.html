<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game 3D Tata Surya - IFP Touch Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
            /* Mencegah zoom tidak sengaja di layar sentuh IFP */
            touch-action: none; 
        }
        #ui-container {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            background: rgba(15, 15, 30, 0.95);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            width: 380px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            color: #4facfe;
        }
        p {
            font-size: 1rem;
            color: #ddd;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }
        #pool-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            min-height: 120px;
            margin-bottom: 15px;
        }
        .planet-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 12px;
            cursor: grab;
            text-align: center;
            transition: background 0.2s, transform 0.2s;
            touch-action: none;
        }
        .planet-card:active {
            cursor: grabbing;
        }
        .planet-card.dragging {
            opacity: 0.4;
        }
        .planet-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin: 0 auto 6px auto;
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.6);
        }
        .planet-name {
            font-size: 0.8rem;
            font-weight: bold;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        #restart-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        }
        #restart-btn:active {
            transform: scale(0.95);
        }
        #message {
            font-weight: bold;
            font-size: 1rem;
            text-align: right;
        }
    </style>
    <!-- Memuat Three.js dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <h1>Misi Tata Surya 3D</h1>
        <p>Sentuh dan seret kartu planet langsung ke jalur orbit lingkaran di layar IFP!</p>
        
        <!-- Panel Pilihan Planet (Diperbesar untuk Jari di IFP) -->
        <div id="pool-container">
            <div class="planet-card" draggable="true" data-planet="Mars">
                <div class="planet-icon" style="background: #c1440e;"></div>
                <div class="planet-name">Mars</div>
            </div>
            <div class="planet-card" draggable="true" data-planet="Merkurius">
                <div class="planet-icon" style="background: #888888;"></div>
                <div class="planet-name">Merkurius</div>
            </div>
            <div class="planet-card" draggable="true" data-planet="Bumi">
                <div class="planet-icon" style="background: #2277ff;"></div>
                <div class="planet-name">Bumi</div>
            </div>
            <div class="planet-card" draggable="true" data-planet="Uranus">
                <div class="planet-icon" style="background: #77ddff;"></div>
                <div class="planet-name">Uranus</div>
            </div>
            <div class="planet-card" draggable="true" data-planet="Venus">
                <div class="planet-icon" style="background: #e3bb76;"></div>
                <div class="planet-name">Venus</div>
            </div>
            <div class="planet-card" draggable="true" data-planet="Saturnus">
                <div class="planet-icon" style="background: #f4e2bb;"></div>
                <div class="planet-name">Saturnus</div>
            </div>
            <div class="planet-card" draggable="true" data-planet="Neptunus">
                <div class="planet-icon" style="background: #3333cc;"></div>
                <div class="planet-name">Neptunus</div>
            </div>
            <div class="planet-card" draggable="true" data-planet="Jupiter">
                <div class="planet-icon" style="background: #d4a373;"></div>
                <div class="planet-name">Jupiter</div>
            </div>
        </div>

        <div class="btn-container">
            <button id="restart-btn">🔄 Ulangi</button>
            <div id="message">0/8 Terpasang</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- SETUP THREE.JS 3D SCENE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 45, 65);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Pencahayaan
        const ambientLight = new THREE.AmbientLight(0x555555);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2, 300);
        scene.add(sunLight);

        // Matahari 3D di pusat
        const sunGeometry = new THREE.SphereGeometry(6, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Data Planet & Jarak Orbit
        const planetData = [
            { name: "Merkurius", distance: 10, size: 0.8, color: 0x888888 },
            { name: "Venus", distance: 15, size: 1.2, color: 0xe3bb76 },
            { name: "Bumi", distance: 21, size: 1.4, color: 0x2277ff },
            { name: "Mars", distance: 28, size: 1.0, color: 0xc1440e },
            { name: "Jupiter", distance: 38, size: 3.0, color: 0xd4a373 },
            { name: "Saturnus", distance: 48, size: 2.5, color: 0xf4e2bb },
            { name: "Uranus", distance: 58, size: 1.8, color: 0x77ddff },
            { name: "Neptunus", distance: 68, size: 1.8, color: 0x3333cc }
        ];

        const orbits = [];
        let activePlanets = {};

        // Membuat garis orbit interaktif (dibuat agak tebal agar mudah disentuh)
        planetData.forEach((data) => {
            const orbitGeo = new THREE.RingGeometry(data.distance - 1.0, data.distance + 1.0, 64);
            const orbitMat = new THREE.MeshBasicMaterial({ color: 0x777777, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            const orbit = new THREE.Mesh(orbitGeo, orbitMat);
            orbit.rotation.x = Math.PI / 2;
            orbit.userData = { distance: data.distance, expectedName: data.name };
            scene.add(orbit);
            orbits.push(orbit);
        });

        // Bintang Latar Belakang
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1200;
        const starPositions = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 400;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.8});
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        function animate() {
            requestAnimationFrame(animate);
            sun.rotation.y += 0.002;

            for (let name in activePlanets) {
                const item = activePlanets[name];
                item.angle += 0.005 / Math.sqrt(item.distance);
                item.mesh.position.x = Math.cos(item.angle) * item.distance;
                item.mesh.position.z = Math.sin(item.angle) * item.distance;
                item.mesh.rotation.y += 0.01;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


        // --- LOGIKA DRAG AND DROP (Mendukung Mouse & Sentuhan Jari IFP) ---
        let draggedPlanetName = null;
        const planetCards = document.querySelectorAll('.planet-card');

        planetCards.forEach(card => {
            card.addEventListener('dragstart', (e) => {
                draggedPlanetName = card.getAttribute('data-planet');
                setTimeout(() => card.classList.add('dragging'), 0);
            });

            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
            });
        });

        const canvas = renderer.domElement;
        canvas.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!draggedPlanetName) return;

            processDrop(e.clientX, e.clientY);
        });

        // Tambahan dukungan Touch Screen langsung (untuk layar IFP yang mendeteksi sentuhan jari)
        let touchPlanetName = null;
        planetCards.forEach(card => {
            card.addEventListener('touchstart', (e) => {
                touchPlanetName = card.getAttribute('data-planet');
            });
        });

        canvas.addEventListener('touchend', (e) => {
            if (!touchPlanetName) return;
            const touch = e.changedTouches[0];
            processDrop(touch.clientX, touch.clientY);
            touchPlanetName = null;
        });

        function processDrop(clientX, clientY) {
            const currentPlanet = draggedPlanetName || touchPlanetName;
            if (!currentPlanet) return;

            const rect = canvas.getBoundingClientRect();
            const mouse = new THREE.Vector2();
            mouse.x = ((clientX - rect.left) / canvas.clientWidth) * 2 - 1;
            mouse.y = -((clientY - rect.top) / canvas.clientHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(orbits);

            if (intersects.length > 0) {
                const hitOrbit = intersects[0].object;
                const targetDistance = hitOrbit.userData.distance;
                const expectedName = hitOrbit.userData.expectedName;

                const pInfo = planetData.find(p => p.name === currentPlanet);

                if (pInfo) {
                    if (activePlanets[expectedName]) {
                        scene.remove(activePlanets[expectedName].mesh);
                    }

                    const planetGeo = new THREE.SphereGeometry(pInfo.size, 32, 32);
                    const planetMat = new THREE.MeshStandardMaterial({ color: pInfo.color, roughness: 0.8 });
                    const planetMesh = new THREE.Mesh(planetGeo, planetMat);
                    
                    const initialAngle = Math.random() * Math.PI * 2;
                    scene.add(planetMesh);

                    activePlanets[expectedName] = {
                        mesh: planetMesh,
                        distance: targetDistance,
                        angle: initialAngle
                    };

                    const cardEl = document.querySelector(`.planet-card[data-planet="${currentPlanet}"]`);
                    if (cardEl) cardEl.remove();

                    draggedPlanetName = null;
                    touchPlanetName = null;
                    checkWinCondition();
                }
            }
        }

        function checkWinCondition() {
            const placedCount = Object.keys(activePlanets).length;
            const msgEl = document.getElementById('message');

            let allCorrect = true;
            planetData.forEach(p => {
                if (!activePlanets[p.name]) {
                    allCorrect = false;
                }
            });

            if (allCorrect) {
                msgEl.style.color = "#2ecc71";
                msgEl.textContent = "🎉 Luar Biasa! Benar Semua!";
            } else {
                msgEl.style.color = "#4facfe";
                msgEl.textContent = `${placedCount}/8 Terpasang`;
            }
        }

        // --- FITUR RESTART ---
        document.getElementById('restart-btn').addEventListener('click', () => {
            location.reload();
        });
    </script>
</body>
</html>
